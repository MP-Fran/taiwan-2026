    return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]).then(function (k) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, k, b64(CT));
    }).then(function (buf) {
      if (remember) { try { localStorage.setItem("tw26key", toB64(raw)); } catch (e) {} }
      var html = new TextDecoder().decode(buf);
      document.open(); document.write(html); document.close();
    });
  }
  function derive(pin) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pin.trim().toLowerCase()), "PBKDF2", false, ["deriveBits"]).then(function (k) {
      return crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" }, k, 256);
    }).then(function (bits) { return new Uint8Array(bits); });
  }
  var saved = null;
  try { saved = localStorage.getItem("tw26key"); } catch (e) {}
  if (saved) unlock(b64(saved), false).catch(function () { try { localStorage.removeItem("tw26key"); } catch (e) {} });
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    msg.textContent = "Unlocking…";
    derive(document.getElementById("pin").value).then(function (raw) { return unlock(raw, true); })
      .catch(function () { msg.textContent = "That PIN did not work. Try again."; });
  });
})();
